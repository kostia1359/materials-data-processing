[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anode-qc"
version = "0.1.0"
description = "SEM batch-QC for silicon-graphite Li-ion anode coatings"
requires-python = ">=3.11"
dependencies = [
    "numpy", "scipy", "scikit-image", "tifffile", "imagecodecs",
    "pandas", "scikit-learn", "matplotlib", "pyyaml", "typer", "tabulate",
]

[project.optional-dependencies]
dev = ["pytest", "gdown"]

[project.scripts]
qc = "qc.cli:app"

[tool.setuptools.packages.find]
include = ["qc*"]
