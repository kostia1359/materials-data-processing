px_nm_target: 25.0
smoothing_sigma_px: 1.5
otsu_classes: 3
pore_hysteresis_levels: 6
pore_min_px: 20
si_opening_radius_px: 1
si_min_px_count: 100
si_min_px_size: 500
si_interior_margin_levels: 10
strips: 5
strip_width_px: 1400
quadrat_px: 700
structure_tensor_sigma_px: 8
crack_sato_sigmas: [1, 2, 3]
crack_min_length_px: 80
crack_max_width_px: 6
curtaining_exclusion_deg: 10
hiz_threshold: 190
hiz_min_px: 50
scale_rel_floor: 0.05
zones: {investigate: 2.5, reject: 4.0, multi_count_z: 2.5, multi_count_n: 3}
shrinkage_grid: [0, 0.25, 0.5, 1.0]
temperature_grid: [0.5, 1, 2, 4, 8]
bootstrap_n: 1000
seed: 0
weights: {R: 1.0, M: 0.7, W: 0.4}
manual_masks: {}

# Section 10 simulation layer: frozen assumptions, identical for every batch.
sim:
  enabled: true
  fuse: {betp_min: 0.6, conflict_max: 0.3, margin_min: 0.2, beta_bse_carbon: 0.7,
         majority_filter: 3, min_island_px: 9, inlens_gradient_weight: 1.0}
  downsample: {factor: 4, max_percolating_fraction_change: 0.02}
  transport: {D_c: 0.05, D_c_sweep: [0.02, 0.05, 0.1], sigma_si: 0.0, solver: spsolve, connectivity: 1}
  electrolyte: {D_bulk_m2s: 1.77e-10, kappa_Sm: 0.949, t_plus: 0.2594, c0_molm3: 1000, source: Nyman2008}
  electrode: {L_um: 70, porosity_convention: [offset_baseline_to_0.30, deep_pore_as_is], cbd_frac_of_solids: 0.08}
  swelling: {dV_V: 2.8, f_A_scenarios: [1.6, 2.43], graphite_vertical: 0.0, cluster_hotspot_um: 5}
  mechanics: {E_ratio: 40, nu_si: 0.22, nu_matrix: 0.30, pore_stiffness: 1e-2, tol: 1e-4, pad_rows: 40, enabled: false}
  cell: {parameter_set: Chen2020_composite, rates: [1, 3], si_radius_factor: 1.273, hysteresis: false, plating_submodel: false, enabled: true}
  energy: {rho_si: 2.33, rho_gr: 2.26, q_gr: 360, q_si_pract: 1700, np_ratio: 1.10, s_graphite: 0.10}
  wetting: {theta_deg: 35, gamma_mNm: 41, eta_mPas: 2.8}
  cli_weights: {f_si: 0.35, d50: 0.20, buffer: 0.25, agglomerate: 0.10, contact: 0.10}
